<h1>客服與聯絡</h1>
<p>遇到問題、想刪除帳號，或有任何建議，請寄信到：<strong><a href="mailto:support@beacontown.app">support@beacontown.app</a></strong>。我們會在 3 個工作天內回覆。</p>
<p>請不要在信中描述你的身心狀況細節。</p>
<h2>如果你現在需要幫助</h2>
<p>請不要等待回信。你可以到 <a href="https://findahelpline.com">findahelpline.com</a> 尋找你所在地的免費求助專線；如有立即危險，請撥打當地緊急電話（台灣 110、救護 119；香港與澳門 999）。</p>
<h2>刪除帳號</h2>
<p>在 App 的「我的 → 帳號 → 刪除帳號」可以直接刪除。也可以來信要求，我們會在 30 天內完成。</p>
